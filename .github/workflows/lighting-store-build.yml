name: Lighting Store Build

on:
  push:
    branches: [main]
    paths:
      - "lighting-store/**"
      - ".github/workflows/lighting-store-build.yml"
  pull_request:
    paths:
      - "lighting-store/**"
      - ".github/workflows/lighting-store-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lighting-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lighting-store/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
